<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Mapa · Projetor</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/mapa-vivo.css">
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font:15px/1.4 system-ui,"Segoe UI",Inter,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;cursor:default}
  body.quieto{cursor:none}
  #pal{position:relative;line-height:0}
  #pal img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
  #gr{position:absolute;inset:0;pointer-events:none;display:none;
    background-image:linear-gradient(to right,rgba(0,0,0,.45) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.45) 1px,transparent 1px);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)}
  body.com-grade #gr{display:block}
  #bar{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
    max-width:calc(100vw - 24px);padding:8px 10px;background:rgba(17,15,24,.86);border:1px solid rgba(255,255,255,.18);border-radius:14px;backdrop-filter:blur(6px);
    transition:opacity .25s}
  body.quieto #bar{opacity:0;pointer-events:none}
  #bar b{margin:0 6px 0 4px;font-weight:700}
  #bar button{font:inherit;color:#eee;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
  #bar button:hover,#bar button:focus-visible{border-color:#fff;outline:none}
  #bar button.on{background:#eee;color:#111;border-color:#eee}
  #bar small{opacity:.6;margin-left:4px}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px}
</style>
</head>
<body>
<div id="pal"><img id="img" alt=""><div class="marcs" id="mk"></div><canvas class="nv" id="nv"></canvas><div id="gr"></div></div>
<div id="bar" role="toolbar" aria-label="Controles do mapa"></div>
<div id="msg" role="alert"></div>
<script type="module" src="js/projetor.js"></script>
</body>
</html>
